name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Setiap hari Senin jam 00:00 UTC
  # Pushes to production run this workflow through deploy.yml (workflow_call), as the
  # gate before the image is built, so it is not triggered a second time here.
  push:
    branches:
      - main
      - prod
  workflow_call:
  pull_request:
    branches:
      - main
      - prod
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency Security Scan & Security Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: Secret scan (gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --log-opts="--all"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, pdo_mysql, bcmath, gd, intl, zip, pcntl, redis
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Application Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Application & Security Tests
        run: php artisan test

      - name: Run Composer Security Audit (Fail-Closed)
        run: composer audit --abandoned=ignore

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      # All npm packages are build-time only: the production image ships compiled
      # assets from public/build, never node_modules. Runtime deps gate the build;
      # the full report (incl. build tooling such as Tailwind 3) stays visible.
      - name: Run NPM Security Audit (Fail-Closed High/Critical, runtime deps)
        run: npm audit --omit=dev --audit-level=high

      - name: NPM audit report incl. build tooling (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high
