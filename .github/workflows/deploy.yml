name: Production CI/CD Deployment

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # ── 1. Quality Gatekeeper (Automated Testing & Security Scan) ──
  test-and-validate:
    name: Test & Security Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Environment & Generate Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Test Suite (133 Tests / 639 Assertions)
        run: php artisan test

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Production Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Run Composer Security Audit (Fail-Closed)
        run: composer audit --abandoned=ignore

  # ── 2. Automated Safe Deployment to VPS via SSH ──
  deploy-to-vps:
    name: "Deploy to VPS (Branch: production)"
    runs-on: ubuntu-latest
    needs: test-and-validate

    steps:
      - name: Execute Safe Deployment on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Memulai proses deployment di VPS..."
            cd /var/www/walhi_app
            chmod +x deploy.sh docker-backup.sh
            ./deploy.sh production
