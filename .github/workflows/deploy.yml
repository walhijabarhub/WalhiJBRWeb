name: Production CI/CD Deployment

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

permissions:
  contents: read


jobs:
  # ── 1. Quality gate: exactly the checks that run on pull requests ──
  # Reuses ci.yml (SQLite + MySQL 8 tests, frontend build, Docker build, compose
  # validation) and security.yml (gitleaks, composer/npm audit, tests). The image is
  # built and deployed only when every job in both workflows has passed.
  # workflow_dispatch can be started from any branch; only production may deploy
  # (the later jobs depend on these and are skipped with them).
  ci:
    name: CI
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/security.yml

  # ── 2. Build the image once in CI and publish it, tagged with the commit ──
  build-image:
    name: Build & Push Image (GHCR)
    runs-on: ubuntu-24.04
    needs: [ci, security]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name (lowercase ghcr.io/<owner>/<repo>) and tag (12-char SHA, same as deploy.sh)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy the exact tested commit to the VPS ──
  deploy-to-vps:
    name: "Deploy to VPS (Branch: production)"
    runs-on: ubuntu-24.04
    needs: build-image
    # Configure required reviewers for this environment in the repository settings.
    environment: production
    permissions:
      contents: read
      packages: read # short-lived GITHUB_TOKEN lets the VPS pull the private image

    steps:
      - name: Execute deployment on VPS via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ needs.build-image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # SHA256 fingerprint of the host's ECDSA key (the key type drone-ssh negotiates first):
          #   ssh-keyscan -t ecdsa HOST | ssh-keygen -lf -
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA,APP_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /var/www/walhi_app
            git fetch origin production
            # Use the deploy scripts from the commit being deployed, not the old ones on disk.
            git checkout "$DEPLOY_SHA" -- deploy.sh docker-backup.sh
            chmod +x deploy.sh docker-backup.sh
            # Log in with the job's token (valid only while this job runs) and always log out,
            # so no long-lived registry credential stays on the server.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            APP_IMAGE="$APP_IMAGE" ./deploy.sh production "$DEPLOY_SHA"
