name: Production CI/CD Deployment

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/irs622/walhi_larafel

jobs:
  # ── 1. Quality gate ──
  test-and-validate:
    name: Test & Security Gatekeeper
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.4 & Extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, pdo_mysql, bcmath, gd, intl, zip, pcntl, redis
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Environment & Generate Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Test Suite
        run: php artisan test

      - name: Run Composer Security Audit (Fail-Closed)
        run: composer audit --abandoned=ignore

  # ── 2. Build the image once in CI and publish it, tagged with the commit ──
  build-image:
    name: Build & Push Image (GHCR)
    runs-on: ubuntu-24.04
    needs: test-and-validate
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image tag (12-char commit SHA, same as deploy.sh)
        id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy the exact tested commit to the VPS ──
  deploy-to-vps:
    name: "Deploy to VPS (Branch: production)"
    runs-on: ubuntu-24.04
    needs: build-image
    # Configure required reviewers for this environment in the repository settings.
    environment: production

    steps:
      - name: Execute deployment on VPS via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # SHA256 host key fingerprint, e.g. from: ssh-keyscan -t ed25519 HOST | ssh-keygen -lf -
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA,APP_IMAGE
          script_stop: true
          script: |
            set -e
            cd /var/www/walhi_app
            git fetch origin production
            # Use the deploy scripts from the commit being deployed, not the old ones on disk.
            git checkout "$DEPLOY_SHA" -- deploy.sh docker-backup.sh
            chmod +x deploy.sh docker-backup.sh
            APP_IMAGE="$APP_IMAGE" ./deploy.sh production "$DEPLOY_SHA"
