name: Continuous Integration (CI)

on:
  # Pushes to production run this workflow through deploy.yml (workflow_call), as the
  # gate before the image is built, so it is not triggered a second time here.
  push:
    branches:
      - main
      - prod
  workflow_call:
  pull_request:
    branches:
      - main
      - prod
      - production

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tag in the comment) so a moved
# tag cannot change what runs in CI.
jobs:
  # ── 1. Tests on SQLite (fast) ──
  backend-tests:
    name: PHP Tests (SQLite)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, pdo_mysql, bcmath, gd, intl, zip, pcntl, redis
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Application Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Automated Tests (PHPUnit)
        run: php artisan test

  # ── 2. Tests on MySQL 8 (same engine as production) ──
  backend-tests-mysql:
    name: PHP Tests (MySQL 8.0)
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: walhi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: walhi_test
      DB_USERNAME: root
      DB_PASSWORD: ci-root

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, bcmath, gd, intl, zip, pcntl, redis
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Application Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations against MySQL
        run: php artisan migrate --force

      - name: Run Automated Tests (PHPUnit, MySQL)
        run: php artisan test

  # ── 3. Frontend Assets Compilation ──
  frontend-build:
    name: Frontend Assets Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Assets (Vite)
        run: npm run build

  # ── 4. Docker Image Build Validation ──
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-24.04
    needs: [backend-tests, backend-tests-mysql, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker Image (Dry-Run Test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: walhi-jabar-app:test

      - name: Validate production compose file
        run: |
          cat > /tmp/ci.env <<'EOF'
          APP_KEY=base64:Y2ktb25seS1ub3QtYS1yZWFsLWtleS1jaS1vbmx5LTA=
          DB_PASSWORD=ci
          DB_ROOT_PASSWORD=ci
          REDIS_PASSWORD=ci
          EOF
          docker compose --env-file /tmp/ci.env -f docker-compose.prod.yml config --quiet
