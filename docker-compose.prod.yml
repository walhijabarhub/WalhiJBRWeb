# ─────────────────────────────────────────────────────────────
# WALHI Jawa Barat — Production Docker Compose Configuration
# Target: 8 GB RAM / 2 vCPU VPS (limits below total ≈ 6 GB, leaving room for the OS)
# ─────────────────────────────────────────────────────────────

# Shared settings for every container that runs the Laravel image (app, worker, scheduler).
x-laravel: &laravel
  image: ${APP_IMAGE:-walhi_larafel-app}:${IMAGE_TAG:-latest}
  # Built once by the app service (below) and reused by worker and scheduler.
  pull_policy: never
  restart: always
  env_file:
    - path: .env
      required: false
  environment: &laravel-env
    APP_NAME: "${APP_NAME:-WALHI Jawa Barat}"
    APP_ENV: "${APP_ENV:-production}"
    APP_KEY: "${APP_KEY:?Error: APP_KEY wajib disetel di .env (php artisan key:generate --show)}"
    APP_DEBUG: "${APP_DEBUG:-false}"
    APP_URL: "${APP_URL:-https://walhijabar.or.id}"

    # Database
    DB_CONNECTION: "${DB_CONNECTION:-mysql}"
    DB_HOST: "${DB_HOST:-db}"
    DB_PORT: "${DB_PORT:-3306}"
    DB_DATABASE: "${DB_DATABASE:-walhi_prod}"
    DB_USERNAME: "${DB_USERNAME:-walhi_user}"
    DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD wajib disetel di .env}"

    # Redis for session, cache, rate limiting and queues (shared by all app containers)
    REDIS_CLIENT: "phpredis"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    REDIS_PASSWORD: "${REDIS_PASSWORD:?Error: REDIS_PASSWORD wajib disetel di .env}"
    SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
    SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
    SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
    CACHE_STORE: "${CACHE_STORE:-redis}"
    CACHE_PREFIX: "${CACHE_PREFIX:-walhi_cache_}"
    QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
    # Maintenance mode is shared through Redis, so it survives container recreation
    # during a deploy (deploy.sh puts the site down before migrating).
    APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-cache}"
    APP_MAINTENANCE_STORE: "${APP_MAINTENANCE_STORE:-redis}"

    # Logging
    LOG_CHANNEL: "${LOG_CHANNEL:-daily}"
    LOG_LEVEL: "${LOG_LEVEL:-warning}"
    LOG_DAILY_DAYS: "${LOG_DAILY_DAYS:-30}"
    FILESYSTEM_DISK: "${FILESYSTEM_DISK:-public}"

    # Only set when another reverse proxy sits in front of nginx (comma-separated IPs/CIDRs)
    TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"

    # Email (SMTP)
    MAIL_MAILER: "${MAIL_MAILER:-smtp}"
    MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
    MAIL_PORT: "${MAIL_PORT:-587}"
    MAIL_USERNAME: "${MAIL_USERNAME:-}"
    MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
    MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-kontak@walhijabar.co.id}"
    MAIL_FROM_NAME: "${MAIL_FROM_NAME:-WALHI Jawa Barat}"

    # Payment Gateway (Midtrans)
    MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:-}"
    MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY:-}"
    MIDTRANS_IS_PRODUCTION: "${MIDTRANS_IS_PRODUCTION:-true}"

    # Admin & Editor Seed Credentials
    ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@walhijabar.co.id}"
    ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    EDITOR_EMAIL: "${EDITOR_EMAIL:-editor@walhijabar.co.id}"
    EDITOR_PASSWORD: "${EDITOR_PASSWORD:-}"
    FORCE_ADMIN_PASSWORD_RESET: "${FORCE_ADMIN_PASSWORD_RESET:-false}"

    # Container Startup Controls
    SEED_ON_START: "${SEED_ON_START:-false}"
    MIGRATE_ON_START: "${MIGRATE_ON_START:-false}"
    CLEAR_CACHE_ON_START: "${CLEAR_CACHE_ON_START:-false}"
  volumes:
    # All of storage/app persists across rebuilds: private documents
    # (storage/app/private/documents) in walhi_prod_app_storage, and public uploads in
    # the existing walhi_prod_storage volume mounted on top (no data migration needed).
    # Sessions and cache live in Redis.
    - walhi_prod_app_storage:/var/www/html/storage/app
    - walhi_prod_storage:/var/www/html/storage/app/public
    - walhi_prod_logs:/var/www/html/storage/logs
  networks:
    - walhi_prod_net
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── 1. Application (PHP-FPM) ──
  app:
    <<: *laravel
    container_name: walhi_prod_app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: app
    volumes:
      - walhi_prod_public:/var/www/html/public_shared
      - walhi_prod_app_storage:/var/www/html/storage/app
      - walhi_prod_storage:/var/www/html/storage/app/public
      - walhi_prod_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M

  # ── 2. Queue worker (mail, notifications) ──
  worker:
    <<: *laravel
    container_name: walhi_prod_worker
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--backoff=30", "--max-time=3600", "--memory=256"]
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: worker
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  # ── 3. Scheduler (walhi:donations-reconcile, walhi:flush-views, ...) ──
  scheduler:
    <<: *laravel
    container_name: walhi_prod_scheduler
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-env
      CONTAINER_ROLE: scheduler
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ── 4. Database (MySQL 8.0) ──
  db:
    image: mysql:8.0
    container_name: walhi_prod_db
    restart: always
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-walhi_prod}"
      MYSQL_USER: "${DB_USERNAME:-walhi_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD wajib disetel di .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Error: DB_ROOT_PASSWORD wajib disetel di .env}"
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 2560M
        reservations:
          cpus: '0.40'
          memory: 1024M
    volumes:
      - walhi_prod_db:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - walhi_prod_net
    healthcheck:
      test: [ "CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysqladmin ping -h localhost -u $${MYSQL_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 5. Redis (session, cache, queue) — internal only, never published ──
  redis:
    image: redis:7.4-alpine
    container_name: walhi_prod_redis
    restart: always
    # The password is written to a config file at start so it never appears in the
    # process list or in the container command.
    command:
      - sh
      - -c
      - printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --appendonly yes --maxmemory 200mb --maxmemory-policy volatile-lru
    volumes:
      - walhi_prod_redis:/data
    networks:
      - walhi_prod_net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Error: REDIS_PASSWORD wajib disetel di .env}"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ── 6. Nginx (edge web server, TLS termination) ──
  web:
    image: nginx:1.27-alpine
    container_name: walhi_prod_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      NGINX_SERVER_NAME: "${NGINX_SERVER_NAME:-walhijabar.or.id}"
    volumes:
      # NGINX_CONF=http (no certificate yet) or https (after setup-ssl.sh)
      - ./docker/nginx/${NGINX_CONF:-http}:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      # NGINX_REALIP=none or cloudflare (restore visitor IP behind Cloudflare)
      - ./docker/nginx/realip/${NGINX_REALIP:-none}:/etc/nginx/realip:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - walhi_prod_public:/var/www/html/public:ro
      - walhi_prod_storage:/var/www/html/storage/app/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - walhi_prod_net
    depends_on:
      app:
        condition: service_healthy

# ── Persistent Storage Volumes ──
volumes:
  walhi_prod_db:
    driver: local
  walhi_prod_app_storage:
    driver: local
  walhi_prod_storage:
    driver: local
  walhi_prod_logs:
    driver: local
  walhi_prod_public:
    driver: local
  walhi_prod_redis:
    driver: local

# ── Private Internal Network ──
networks:
  walhi_prod_net:
    driver: bridge
