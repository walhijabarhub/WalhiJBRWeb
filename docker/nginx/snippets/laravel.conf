# Shared Laravel server configuration, included by the http and https templates.

root /var/www/html/public;
index index.php index.html;

charset utf-8;
server_tokens off;
client_max_body_size 25M;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

# Container health probe (does not touch PHP)
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
}

# Block direct execution of PHP in storage and assets directories
location ~* ^/(storage|assets)/.*\.php$ {
    deny all;
    return 404;
}

# PHP-FPM status/ping are for the container healthcheck only
location ~ ^/(status|ping)$ {
    deny all;
    return 404;
}

# Static assets (1 year)
location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, no-transform";
    access_log off;
    log_not_found off;
    try_files $uri =404;
}

# Public uploads (static only, script execution blocked)
location ^~ /storage/ {
    alias /var/www/html/storage/app/public/;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;

    location ~* \.(php|php[0-9]|phtml|phar|sh|pl|py|cgi|htaccess|bat|exe)$ {
        deny all;
        return 404;
    }
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Hidden files (.env, .git, ...)
location ~ /\.(?!well-known).* {
    deny all;
}

location ~ \.php$ {
    fastcgi_pass app:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;

    # nginx is the edge: REMOTE_ADDR (from fastcgi_params) is the client address,
    # resolved by the optional real_ip config for Cloudflare. Client-supplied
    # forwarding headers are dropped so they can never be trusted by the app.
    fastcgi_param HTTP_X_FORWARDED_FOR "";
    fastcgi_param HTTP_X_FORWARDED_HOST "";
    fastcgi_param HTTP_X_FORWARDED_PORT "";
    fastcgi_param HTTP_X_FORWARDED_PROTO "";
    fastcgi_param HTTP_X_FORWARDED_PREFIX "";
    fastcgi_param HTTP_X_REAL_IP "";
    fastcgi_param HTTPS $https if_not_empty;

    fastcgi_connect_timeout 10s;
    fastcgi_send_timeout 60s;
    fastcgi_read_timeout 60s;

    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;
}

error_page 404 /index.php;
