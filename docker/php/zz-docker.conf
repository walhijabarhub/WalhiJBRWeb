; ─────────────────────────────────────────────────────────────
; WALHI Jawa Barat — PHP-FPM Pool Tuning for 8 GB RAM / 2 vCPU VPS
; Target resident memory per worker: ~40-60 MB
; Peak concurrency budget: 18 workers = ~900 MB – 1.1 GB base
; ─────────────────────────────────────────────────────────────

[global]
; Keep PHP-FPM in the foreground for Docker container process management
daemonize = no

[www]
listen = 9000

; Dynamic process management tuned for 8 GB RAM & 2 vCPUs
; Concurrency capacity: 18 concurrent workers
pm = dynamic
pm.max_children = 18
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 6
pm.max_requests = 1000

; Prevent stuck workers from holding memory indefinitely (60s timeout)
request_terminate_timeout = 60s

; Health probe for the container healthcheck (cgi-fcgi). nginx blocks /ping and
; /status from the public; they are only reachable inside the app container.
ping.path = /ping
ping.response = pong
pm.status_path = /status

; Log requests slower than 5s with a stack trace (storage/logs volume)
slowlog = /var/www/html/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 5s

; Logging & stream handling
catch_workers_output = yes
decorate_workers_output = no
