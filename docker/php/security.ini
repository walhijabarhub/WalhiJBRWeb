; Session upload progress is on by default and runs during multipart parsing without
; session_start(). It was a validated trigger for CVE-2026-109619 (GHSA-6wmf-4rv5-p3rp);
; the advisory recommends keeping it off after patching when unused. The app never
; reads upload progress.
session.upload_progress.enabled = 0

; Do not advertise the PHP version in responses (X-Powered-By).
expose_php = Off
