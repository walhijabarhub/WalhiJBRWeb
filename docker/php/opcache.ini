[opcache]
opcache.enable = 1
opcache.enable_cli = 1

; Memory budget for bytecode & interned strings
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000

; In production, disable filesystem timestamp checks for maximum speed
; Fresh code is loaded on container rebuild/restart
opcache.validate_timestamps = 0

; Preserve docblock comments required by Laravel and third-party libraries
opcache.save_comments = 1
opcache.revalidate_freq = 0
